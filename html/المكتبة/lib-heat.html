            <script>
                function filterBooks() {
                    const query = document.getElementById('searchInput').value.toLowerCase();
                    const books = document.querySelectorAll('.book-item');
                    let hasVisible = false;
                    books.forEach(book => {
                        const title = book.querySelector('h3').innerText.toLowerCase();
                        if (title.includes(query)) {
                            book.style.display = 'flex';
                            hasVisible = true;
                        } else {
                            book.style.display = 'none';
                        }
                    });
                    
                    const noResults = document.getElementById('noResults');
                    if(!hasVisible) {
                        if(!noResults) {
                            const msg = document.createElement('div');
                            msg.id = 'noResults';
                            msg.className = 'text-center text-slate-500 mt-8 font-medium py-8 bg-slate-50 rounded-2xl border border-slate-100';
                            msg.innerHTML = '<i class="fa-solid fa-face-frown text-3xl mb-3 text-slate-300 block"></i> لا يوجد كتاب مطابق للبحث في هذا القسم';
                            document.getElementById('booksContainer').appendChild(msg);
                        } else {
                            noResults.style.display = 'block';
                        }
                    } else if (noResults) {
                        noResults.style.display = 'none';
                    }
                }
            </script>
